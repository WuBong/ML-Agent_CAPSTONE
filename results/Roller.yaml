behaviors:
  RollerAgent:
    trainer_type: ppo

    network_settings:
      normalize: true
      hidden_units: 128          # 관측 6개면 128이면 충분
      num_layers: 2
      vis_encode_type: simple    # 사용 안 해도 무방

    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-4
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    reward_signals:
      extrinsic:
        strength: 1.0
        gamma: 0.99

    max_steps: 500000            # 50 만 스텝
    time_horizon: 64
    summary_freq: 5000
